name: Build GNOME Network Displays (DEB)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # 允许在 GitHub 网页端手动触发构建

jobs:
  build-and-package:
    name: Build DEB on Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 获取完整历史以计算版本号
        # 注意：GNOME master 分支的依赖更新很快。
        # 如果编译提示 Ubuntu 22.04 的 gtk4 或 libadwaita 版本太低，
        # 请取消注释下面这行，并指定一个老一点的稳定版本 Tag（例如 0.93.0 或 0.90.5）
        # ref: '0.93.0'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        
        # 安装基础构建工具
        sudo apt-get install -y \
          meson ninja-build pkg-config gcc g++ gettext appstream-util desktop-file-utils
        
        # 根据官方 README 安装 Ubuntu 依赖
        sudo apt-get install -y \
          libgstrtspserver-1.0-dev libgstreamer-plugins-base1.0-dev \
          libavahi-client-dev libavahi-gobject-dev libgtk-3-dev libnm-dev \
          libpulse-dev libprotobuf-c-dev libjson-glib-dev libsoup-3.0-dev \
          libportal-gtk4-dev libgtk-4-dev libadwaita-1-dev

    - name: Configure and Build
      run: |
        # 使用 meson 配置构建环境，安装目录前缀设为 /usr
        meson setup build --prefix=/usr --buildtype=release
        
        # 使用 ninja 进行编译
        ninja -C build

    - name: Package into DEB
      run: |
        # 1. 准备 DEB 打包的临时目录结构
        mkdir -p deb_dist/DEBIAN
        
        # 2. 将编译好的文件“假装”安装到临时目录 deb_dist 中
        DESTDIR=$(pwd)/deb_dist ninja -C build install
        
        # 3. 动态获取版本号 (优先从 git tag 获取，如果没有 tag 则用 commit hash)
        VERSION=$(git describe --tags --always | sed 's/^v//')
        
        # 4. 计算软件安装后的大小 (单位 KB)
        SIZE=$(du -sk deb_dist/usr | cut -f1)
        
        # 5. 生成 DEBIAN/control 控制文件
        cat <<EOF > deb_dist/DEBIAN/control
        Package: gnome-network-displays
        Version: ${VERSION}-1~ubuntu22.04
        Architecture: amd64
        Maintainer: GitHub Actions
        Installed-Size: ${SIZE}
        Depends: libc6 (>= 2.34), libglib2.0-0, libgtk-4-1, libadwaita-1-0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, libgstrtspserver-1.0-0, libnm0, libpulse0, libavahi-client3, libjson-glib-1.0-0, network-manager, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad
        Section: video
        Priority: optional
        Description: GNOME Network Displays (Miracast)
         This is an experimental implementation of Wi-Fi Display (aka Miracast).
         The application will stream the selected monitor to a remote display.
         Built automatically via GitHub Actions.
        EOF
        
        # 6. 修正权限 (Debian 规范要求 DEBIAN 目录为 755，control 文件为 644)
        chmod 0755 deb_dist/DEBIAN
        chmod 0644 deb_dist/DEBIAN/control
        
        # 7. 使用 dpkg-deb 打包
        dpkg-deb --build deb_dist gnome-network-displays_${VERSION}_amd64.deb

    - name: Upload DEB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gnome-network-displays-ubuntu22.04-amd64
        path: "*.deb"
        retention-days: 7 # 产物保留 7 天
